<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" role="img" aria-labelledby="t d">
  <title id="t">The modules of Doctize</title>
  <desc id="d">The Gradle plugin runs the command line tool. The command line tool, the annotation processor and the licensing tool depend on the generator library. The processor also depends on the annotations, which the library only needs while compiling.</desc>
  <style>
    .mod { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .core { fill: #e0e7ff; stroke: #3730a3; stroke-width: 2.5; }
    .internal { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 6 4; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; fill: #1e1b4b; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #4b5563; }
    .n { font-size: 11px; fill: #6b7280; }
    .arrow { fill: none; stroke: #4f46e5; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .dashed { stroke-dasharray: 6 5; }
    .legend { text-anchor: start; }
  </style>

  <rect class="mod" x="200" y="10" width="150" height="54" rx="10"/>
  <text class="h" x="275" y="34">doctize-gradle-plugin</text><text class="s" x="275" y="51">the Gradle plugin</text>

  <rect class="internal" x="10" y="110" width="170" height="54" rx="10"/>
  <text class="h" x="95" y="134">doctize-licensing</text><text class="s" x="95" y="151">vendor tool, not published</text>

  <rect class="mod" x="200" y="110" width="150" height="54" rx="10"/>
  <text class="h" x="275" y="134">doctize-cli</text><text class="s" x="275" y="151">the doctize command</text>

  <rect class="mod" x="380" y="110" width="150" height="54" rx="10"/>
  <text class="h" x="455" y="134">doctize-processor</text><text class="s" x="455" y="151">annotation processor</text>

  <rect class="core" x="200" y="220" width="150" height="54" rx="10"/>
  <text class="h" x="275" y="244">doctize-core</text><text class="s" x="275" y="261">the generator library</text>

  <rect class="mod" x="470" y="220" width="150" height="54" rx="10"/>
  <text class="h" x="545" y="244">doctize-annotations</text><text class="s" x="545" y="261">the annotations</text>

  <!-- the plugin runs the CLI as a separate process -->
  <path class="arrow dashed" d="M275 65v39m-6-6 6 6 6-6"/>
  <text class="n" x="325" y="90">runs</text>
  <!-- depends on the library -->
  <path class="arrow" d="M275 165v49m-6-6 6 6 6-6"/>
  <path class="arrow" d="M100 165 220 214m-3-9 3 9-9 3"/>
  <path class="arrow" d="M415 165 335 214m4-9-4 9 9 3"/>
  <!-- the processor uses the annotations -->
  <path class="arrow" d="M500 165 525 214m-9-4 9 4 3-9"/>
  <!-- the library needs the annotations only to compile -->
  <path class="arrow dashed" d="M351 247h113m-6-6 6 6-6 6"/>
  <text class="n" x="408" y="240">compileOnly</text>

  <text class="n legend" x="10" y="312">Solid arrow: depends on. Dashed arrow: runs it in another process, or needs it only to compile.</text>
</svg>
