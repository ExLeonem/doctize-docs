<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" role="img" aria-labelledby="t d">
  <title id="t">The Doctize pipeline</title>
  <desc id="d">Compile with the processor, collect pages from sources, assemble sections, render content, apply theme templates, write the site.</desc>
  <style>
    .stage { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .out { fill: #ecfdf5; stroke: #16803c; }
    .in { fill: #fff7ed; stroke: #c2410c; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; fill: #1e1b4b; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #4b5563; }
    .n { font-size: 11px; fill: #6b7280; }
    .arrow { fill: none; stroke: #4f46e5; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g transform="translate(0 50)">
    <rect class="stage in" x="5" y="0" width="112" height="64" rx="10"/>
    <text class="h" x="61" y="27">Compile</text><text class="s" x="61" y="45">javac + processor</text>

    <rect class="stage" x="143" y="0" width="112" height="64" rx="10"/>
    <text class="h" x="199" y="27">Page sources</text><text class="s" x="199" y="45">from any source</text>

    <rect class="stage" x="281" y="0" width="112" height="64" rx="10"/>
    <text class="h" x="337" y="27">Assemble</text><text class="s" x="337" y="45">sections, URLs</text>

    <rect class="stage" x="419" y="0" width="112" height="64" rx="10"/>
    <text class="h" x="475" y="27">Render</text><text class="s" x="475" y="45">Javadoc → HTML</text>

    <rect class="stage" x="557" y="0" width="112" height="64" rx="10"/>
    <text class="h" x="613" y="27">Theme</text><text class="s" x="613" y="45">Mustache templates</text>

    <rect class="stage out" x="695" y="0" width="80" height="64" rx="10"/>
    <text class="h" x="735" y="27">Site</text><text class="s" x="735" y="45">static files</text>

    <path class="arrow" d="M118 32h20m-6-6 6 6-6 6"/>
    <path class="arrow" d="M256 32h20m-6-6 6 6-6 6"/>
    <path class="arrow" d="M394 32h20m-6-6 6 6-6 6"/>
    <path class="arrow" d="M532 32h20m-6-6 6 6-6 6"/>
    <path class="arrow" d="M670 32h20m-6-6 6 6-6 6"/>
  </g>
  <text class="n" x="61" y="140">model.json</text>
  <text class="n" x="199" y="140">Page objects</text>
  <text class="n" x="337" y="140">Site</text>
  <text class="n" x="475" y="140">RenderedPage</text>
  <text class="n" x="613" y="140">HTML pages</text>
  <text class="n" x="735" y="140">+ search index</text>
</svg>
